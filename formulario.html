<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/formulario.css">
    <link rel="icon" href="icon/favicon_io/favicon-16x16.png">
    <title>Formulario de Interés en Vehículos de Lujo</title>
</head>
<body>
    <div class="container">
        <h1>Descubre el Placer de Conducir un Automóvil de Lujo
            <img src="images/coche-de-carreras.png" alt="">
        </h1>
        <form id="luxuryCarForm">
            <div class="form-group">
                <label for="fullName">Nombre Completo:</label>
                <input type="text" id="fullName" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Número de Teléfono:</label>
                <input type="tel" id="phone" required>
            </div>
            <div class="form-group">
                <label for="city">Ciudad:</label>
                <input type="text" id="city" required>
            </div>
            <div class="form-group">
                <label>Tipo de Vehículo de Lujo:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="Sedán"> Sedán</label>
                    <label><input type="checkbox" value="SUV"> SUV</label>
                    <label><input type="checkbox" value="Coupé"> Coupé</label>
                    <label><input type="checkbox" value="Convertible"> Convertible</label>
                    <label><input type="checkbox" value="Híbrido/Eléctrico"> Híbrido/Eléctrico</label>
                    <label><input type="checkbox" value="Otro"> Otro</label>
                </div>
            </div>
            <div class="form-group">
                <label>Marca de Lujo Preferida:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="Mercedes-Benz"> Mercedes-Benz</label>
                    <label><input type="checkbox" value="BMW"> BMW</label>
                    <label><input type="checkbox" value="Audi"> Audi</label>
                    <label><input type="checkbox" value="Porsche"> Porsche</label>
                    <label><input type="checkbox" value="Lamborghini"> Lamborghini</label>
                    <label><input type="checkbox" value="Otro"> Otro</label>
                </div>
            </div>
            <div class="form-group">
                <label>Interés en:</label>
                <select id="interest" required>
                    <option value="Comprar">Comprar</option>
                    <option value="Financiar">Financiar</option>
                    <option value="Arrendar">Arrendar</option>
                </select>
            </div>
            <div class="form-group">
                <label for="budget">Presupuesto Aproximado:</label>
                <input type="text" id="budget" required>
            </div>
            <div class="form-group">
                <label>¿Cuándo planeas realizar tu compra?</label>
                <select id="purchaseTime" required>
                    <option value="Inmediatamente">Inmediatamente</option>
                    <option value="1-3 meses">Dentro de 1-3 meses</option>
                    <option value="3-6 meses">Dentro de 3-6 meses</option>
                    <option value="Más de 6 meses">Más de 6 meses</option>
                </select>
            </div>
            <div class="form-group">
                <label>¿Cómo prefieres que te contactemos?</label>
                <div class="radio-group">
                    <label><input type="radio" name="contactMethod" value="Correo Electrónico" required> Correo Electrónico</label>
                    <label><input type="radio" name="contactMethod" value="Llamada Telefónica"> Llamada Telefónica</label>
                    <label><input type="radio" name="contactMethod" value="Mensaje de Texto"> Mensaje de Texto</label>
                </div>
            </div>
            <div class="form-group">
                <label for="comments">Comentarios Adicionales:</label>
                <textarea id="comments"></textarea>
            </div>
            <div class="form-group">
                <button type="submit" class="submit-button">Enviar Solicitud</button>
            </div>
        </form>
    </div>          
    <script src="js/formulario.js"></script>

</body>
</html>
